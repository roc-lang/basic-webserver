[package]
name = "datastar-transport-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "=1.11.1"
brotli = "=8.0.4"
flate2 = "=1.1.9"
futures = "=0.3.31"
h2 = "=0.4.15"
http-body-util = "=0.1.3"
hyper = { version = "=1.6.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "=0.1.12", features = ["tokio", "http1", "http2"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
zstd = { version = "=0.13.3", default-features = false }
