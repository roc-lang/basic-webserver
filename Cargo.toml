[package]
name = "roc_host"
version = "0.0.1"
authors = ["The Roc Contributors"]
edition = "2021"
rust-version = "1.97"
license = "UPL-1.0"
repository = "https://github.com/roc-lang/basic-webserver"
description = "Host implementation for the basic-webserver Roc platform (direct-symbol ABI)."

[lib]
name = "host"
crate-type = ["staticlib"]

[features]
local-load-test = []

[[bin]]
name = "local-load"
path = "scripts/perf/load.rs"
required-features = ["local-load-test"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(no_roc_std_helpers)"] }

[dependencies]
libc = "=0.2.172"
libsqlite3-sys = { version = "=0.33.0", features = ["bundled"] }
bytes = "=1.11.1"
brotli = "=8.0.4"
cap-primitives = "=4.0.2"
flate2 = "=1.1.9"
zstd = { version = "=0.13.3", default-features = false }
futures = "=0.3.31"
hyper = { version = "=1.6.0", features = ["http1", "http2", "client", "server"] }
http-body-util = "=0.1.3"
httpdate = "=1.0.3"
hyper-util = { version = "=0.1.12", features = ["tokio", "client", "client-legacy", "server", "server-auto", "http1", "http2"] }
# Outbound HTTP client TLS stack (Http.send!). `ring` is the rustls crypto
# backend, and WebPKI roots keep the static host self-contained for Roc linking.
hyper-rustls = { version = "=0.27.6", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio", "ring"] }
rustls = { version = "=0.23.41", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.0", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-service = "=0.3.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
strip = "debuginfo"
panic = "abort"

# Validation-only host used by the Linux Memcheck lane. A single code-generation
# unit keeps every hosted symbol in the archive member pulled in by Roc's
# executable entrypoint; Roc's optimized backend declares hosted imports weak,
# so a multi-member debug archive would otherwise fail to extract callbacks
# that are only referenced by the application. Debug information and modest
# optimization keep native diagnostics useful without changing production.
[profile.memcheck]
inherits = "release"
debug = 2
strip = "none"
opt-level = 1
lto = false
codegen-units = 1
