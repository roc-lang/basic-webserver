[package]
name = "roc_host"
version = "0.0.1"
authors = ["The Roc Contributors"]
edition = "2021"
license = "UPL-1.0"
repository = "https://github.com/roc-lang/basic-webserver"
description = "Host implementation for the basic-webserver Roc platform (direct-symbol ABI)."

[lib]
name = "host"
crate-type = ["staticlib"]

[dependencies]
libc = "=0.2.172"
bytes = "=1.10.1"
futures = "=0.3.31"
hyper = { version = "=1.6.0", features = ["http1", "http2", "client", "server"] }
http-body-util = "=0.1.3"
hyper-util = { version = "=0.1.12", features = ["tokio"] }
tokio = { version = "=1.45.0", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }

[profile.release]
lto = true
strip = "debuginfo"
panic = "abort"
