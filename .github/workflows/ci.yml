name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  rust-version:
    name: read Rust version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build and test (${{ matrix.target }})
    needs: rust-version
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
            rust_target: x86_64-unknown-linux-musl
            install_zig: true
            is_musl: true
          - os: ubuntu-24.04-arm
            target: arm64musl
            rust_target: aarch64-unknown-linux-musl
            install_zig: true
            is_musl: true
          - os: macos-26-intel
            target: x64mac
            rust_target: x86_64-apple-darwin
            install_zig: false
            is_musl: false
          - os: macos-26
            target: arm64mac
            rust_target: aarch64-apple-darwin
            install_zig: false
            is_musl: false
          - os: windows-2025
            target: x64win
            rust_target: x86_64-pc-windows-msvc
            install_zig: false
            is_musl: false

    steps:
      - uses: actions/checkout@v7

      - name: Install the Zig-based Roc compiler
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427 # ratchet:roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler

      - run: roc version

      - name: Install Zig
        if: matrix.install_zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target "${{ matrix.rust_target }}"
          rustup default "${{ needs.rust-version.outputs.version }}"

      - name: Install LLVM tools for Linux host stripping
        if: matrix.is_musl
        run: rustup component add llvm-tools-preview

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Build host static library
        run: ./build.sh --target "${{ matrix.target }}"

      - name: Build and test Roc examples
        run: ./ci/all_tests.sh

      - name: Upload runtime conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-results-${{ matrix.target }}
          path: target/spec/results-*.json
          if-no-files-found: error

  cross-platform-conformance:
    name: compare cross-platform runtime coverage
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download runtime results
        uses: actions/download-artifact@v8
        with:
          pattern: spec-results-*
          path: target/spec-results

      - name: Verify every target ran the same cases
        run: python3 scripts/check_test_results.py target/spec-results
