name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  rust-version:
    name: read Rust version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: validate sources
    needs: rust-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Zig-based Roc compiler
        uses: ./.github/actions/setup-roc

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ needs.rust-version.outputs.version }}"
          rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Checkout the matching Roc glue specification
        uses: actions/checkout@v7
        with:
          repository: roc-lang/roc
          ref: fdd77c3969722edb53033c0847bdb3fd05609e47
          path: target/roc-glue-source
          sparse-checkout: src/glue/src/RustGlue.roc

      - name: Check generated Rust glue
        env:
          ROC_GLUE_SPEC: target/roc-glue-source/src/glue/src/RustGlue.roc
        run: python scripts/regenerate_glue.py --check

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Format, check, and test Roc examples
        run: python scripts/test.py --operation validate

  build-examples:
    name: build examples (${{ matrix.target }})
    needs: [rust-version, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: arm64musl
            rust_target: aarch64-unknown-linux-musl
          - os: macos-26-intel
            target: x64mac
            rust_target: x86_64-apple-darwin
          - os: macos-26
            target: arm64mac
            rust_target: aarch64-apple-darwin
          - os: windows-2025
            target: x64win
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install the Zig-based Roc compiler
        uses: ./.github/actions/setup-roc

      - run: roc version

      - name: Install Zig
        if: endsWith(matrix.target, 'musl')
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target "${{ matrix.rust_target }}"
          rustup default "${{ needs.rust-version.outputs.version }}"

      - name: Install LLVM tools for Linux host stripping
        if: endsWith(matrix.target, 'musl')
        run: rustup component add llvm-tools-preview

      - name: Build host static library
        run: python scripts/build.py --target "${{ matrix.target }}"

      - name: Cross-compile every Roc example
        run: python scripts/test.py --operation build --target "${{ matrix.target }}" --artifact-dir dist/example-binaries

      - name: Upload example binaries
        uses: actions/upload-artifact@v7
        with:
          name: basic-webserver-example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}
          if-no-files-found: error

  run-examples:
    name: run examples (${{ matrix.target }})
    needs: build-examples
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x64musl
          - os: ubuntu-24.04-arm
            target: arm64musl
          - os: macos-26-intel
            target: x64mac
          - os: macos-26
            target: arm64mac
          - os: windows-2025
            target: x64win

    steps:
      - uses: actions/checkout@v7

      - name: Download native example binaries
        uses: actions/download-artifact@v8
        with:
          name: basic-webserver-example-binaries-${{ matrix.target }}
          path: dist/example-binaries/${{ matrix.target }}

      - name: Run native spec cases
        run: python scripts/test.py --operation run --target "${{ matrix.target }}" --artifact-dir dist/example-binaries

      - name: Upload runtime conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-results-${{ matrix.target }}
          path: target/spec/results-*.json
          if-no-files-found: error

  cross-platform-conformance:
    name: compare cross-platform runtime coverage
    needs: run-examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download runtime results
        uses: actions/download-artifact@v8
        with:
          pattern: spec-results-*
          path: target/spec-results

      - name: Verify every target ran the same cases
        run: python scripts/test.py --operation compare --results-dir target/spec-results
