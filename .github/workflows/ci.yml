name: CI

on:
  # TEMPORARY: disabled on PRs while the nightly job is being verified.
  # Restore before merging.
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  rust-version:
    name: read Rust version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: validate sources
    needs: rust-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Zig-based Roc compiler
        uses: ./.github/actions/setup-roc
        with:
          with-source: "true"

      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
        with:
          version: 0.16.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ needs.rust-version.outputs.version }}"
          rustup component add rustfmt llvm-tools-preview

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check generated Rust glue
        env:
          ROC_GLUE_SPEC: target/roc-source/src/glue/src/RustGlue.roc
        run: python scripts/regenerate_glue.py --check

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Run substituted-transport server invariants
        run: python scripts/benchmark.py check

      - name: Format, check, and test Roc examples
        run: python scripts/test.py --operation validate

  memcheck:
    name: Linux examples under Memcheck
    needs: rust-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the Zig-based Roc compiler
        uses: ./.github/actions/setup-roc

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal
          rustup default "${{ needs.rust-version.outputs.version }}"

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Run every Linux example under Memcheck
        run: python scripts/test.py --operation memcheck
