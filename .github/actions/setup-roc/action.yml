name: Install the pinned Roc compiler
description: Install the exact Roc release or nightly selected by this repository

inputs:
  with-source:
    description: Download the matching Roc source tree for glue validation
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the Roc version
      id: roc-version
      shell: bash
      run: |
        set -euo pipefail

        version_file="$GITHUB_WORKSPACE/.roc-version"
        if [[ ! -f "$version_file" ]]; then
          echo "Missing Roc version file: $version_file"
          exit 1
        fi
        tag="$(sed 's/\r$//' "$version_file")"
        if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          # Release from roc-lang/roc
          {
            echo "setup-version=$tag"
            echo "nightly-tag="
            echo "release-api=https://api.github.com/repos/roc-lang/roc/releases/tags/$tag"
            echo "source-asset=roc-source-$tag.tar.gz"
          } >> "$GITHUB_OUTPUT"
        elif [[ "$tag" =~ ^nightly-[0-9]{4}-([A-Za-z]+|[0-9]{2})-[0-9]{2}-[0-9a-f]{7}$ ]]; then
          {
            echo "setup-version=nightly"
            echo "nightly-tag=$tag"
            echo "release-api=https://api.github.com/repos/roc-lang/nightlies/releases/tags/$tag"
            echo "source-asset=roc_nightly-source-${tag#nightly-}.tar.gz"
          } >> "$GITHUB_OUTPUT"
        else
          echo "Invalid Roc version in $version_file: $tag"
          exit 1
        fi
        echo "Installing Roc $tag from .roc-version"

    - uses: roc-lang/setup-roc@19c9da4f0158ca74c4ac27d8999c17b5c2739cbf # ratchet:roc-lang/setup-roc@main
      with:
        version: ${{ steps.roc-version.outputs.setup-version }}
        nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
        cache: "false"

    - name: Download the matching Roc source
      if: inputs.with-source == 'true'
      shell: bash
      env:
        RELEASE_API: ${{ steps.roc-version.outputs.release-api }}
        SOURCE_ASSET: ${{ steps.roc-version.outputs.source-asset }}
        TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        auth_header=()
        if [[ -n "$TOKEN" ]]; then
          auth_header=(-H "Authorization: Bearer $TOKEN")
        fi
        source_url="$(
          curl -fsSL "${auth_header[@]}" "$RELEASE_API" |
            jq -er --arg name "$SOURCE_ASSET" '.assets[] | select(.name == $name) | .browser_download_url'
        )"

        source_dir="$GITHUB_WORKSPACE/target/roc-source"
        mkdir -p "$source_dir"
        curl -fsSL "${auth_header[@]}" "$source_url" |
          tar -xzf - --strip-components=1 -C "$source_dir"
        test -f "$source_dir/src/glue/src/RustGlue.roc"
