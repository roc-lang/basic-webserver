name: Install the pinned Roc compiler
description: Install the exact new-compiler nightly selected by this repository

inputs:
  use-latest:
    description: Install the latest nightly instead of the version in .roc-version
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the Roc nightly
      id: roc-version
      shell: bash
      env:
        USE_LATEST: ${{ inputs.use-latest }}
      run: |
        set -euo pipefail

        case "$USE_LATEST" in
          true)
            nightly_tag=""
            echo "Installing the latest Roc nightly"
            ;;
          false)
            version_file="$GITHUB_WORKSPACE/.roc-version"
            if [[ ! -f "$version_file" ]]; then
              echo "Missing Roc version file: $version_file"
              exit 1
            fi
            nightly_tag="$(sed 's/\r$//' "$version_file")"
            if [[ ! "$nightly_tag" =~ ^nightly-[0-9]{4}-[A-Za-z]+-[0-9]{2}-[0-9a-f]{7}$ ]]; then
              echo "Invalid Roc nightly tag in $version_file: $nightly_tag"
              exit 1
            fi
            echo "Installing Roc $nightly_tag from .roc-version"
            ;;
          *)
            echo "use-latest must be true or false, got: $USE_LATEST"
            exit 1
            ;;
        esac

        printf 'nightly-tag=%s\n' "$nightly_tag" >> "$GITHUB_OUTPUT"

    - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427 # ratchet:roc-lang/setup-roc@v0.3.0
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
