name: Install the pinned Roc compiler
description: Build the exact Roc revision used to generate and test this experimental platform

runs:
  using: composite
  steps:
    - name: Install Zig for the pinned compiler build
      uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f
      with:
        version: 0.16.0

    - name: Checkout the pinned Roc source
      uses: actions/checkout@v7
      with:
        repository: roc-lang/roc
        ref: 5eb3fe6460aa1b734f173bbb2cc5c15892eff1dc
        path: target/roc-source

    - name: Build the pinned Roc compiler
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/target/roc-source"
        zig build roc
        echo "$GITHUB_WORKSPACE/target/roc-source/zig-out/bin" >> "$GITHUB_PATH"
